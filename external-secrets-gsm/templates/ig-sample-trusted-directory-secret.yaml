apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.ig.sampleTrustedDirectory.clusterSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-store
  target:
    name: {{ .Values.ig.sampleTrustedDirectory.clusterSecretName }}
    creationPolicy: Owner
  data:
  - secretKey: sample-trusted-directory-keystore.p12
    remoteRef:
      key: {{ .Values.ig.sampleTrustedDirectory.externalSecretName }}
