---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalCert.sampleTrustedDirectory.tlsClusterSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-store
  target:
    name: {{ .Values.externalCert.sampleTrustedDirectory.tlsClusterSecretName }}
    creationPolicy: Owner
  data:
  - secretKey: tls.crt
    remoteRef:
      key: {{ .Values.externalCert.sampleTrustedDirectory.tlsExternalCertPrefix }}-crt
  - secretKey: tls.key
    remoteRef:
      key: {{ .Values.externalCert.sampleTrustedDirectory.tlsExternalCertPrefix }}-key
